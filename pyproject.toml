[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-object-tracking"
version = "1.1.0"
description = "Real-time object detection and segmentation in video sequences (YOLO-Seg)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pablo González" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "torch>=2.2",
    "ultralytics>=8.2",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "requests>=2.31",
    "tqdm>=4.66",
    "Pillow>=10.0",
]

[project.scripts]
rto-monitor = "src.monitor:main"

[project.optional-dependencies]
# Only needed to evaluate against the COCO dataset and to save visualizations.
eval = ["pycocotools>=2.0.7"]
# Only needed for the Tkinter GUI.
gui = ["ttkthemes>=3.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "coverage>=7.0",
]

[tool.setuptools]
packages = ["src", "data_sets"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv"]
